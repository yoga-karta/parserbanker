name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mingw-w64 gcc (needed for CGO / go-duckdb / webview)
        run: choco install mingw --version=13.2.0 -y

      - name: Build frontend (static export)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Embed frontend into backend
        run: |
          New-Item -ItemType Directory -Force -Path backend/webui | Out-Null
          Copy-Item -Path frontend/out/* -Destination backend/webui -Recurse -Force

      - name: Build backend exe
        working-directory: backend
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -o pilot-diff.exe .

      - name: Fetch WebView2Loader.dll (runtime-loaded by webview_go, not statically linked)
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory webview2-pkg
          Copy-Item -Path "webview2-pkg/Microsoft.Web.WebView2.*/build/native/x64/WebView2Loader.dll" -Destination backend/WebView2Loader.dll

      - uses: actions/upload-artifact@v4
        with:
          name: pilot-diff-exe
          path: |
            backend/pilot-diff.exe
            backend/WebView2Loader.dll
